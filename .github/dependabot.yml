version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Detroit"
    open-pull-requests-limit: 5
    groups:
      safe-npm-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "America/Detroit"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    groups:
      safe-python-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/Detroit"
    open-pull-requests-limit: 5
    groups:
      safe-action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
