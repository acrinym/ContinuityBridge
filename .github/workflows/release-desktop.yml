name: Desktop release bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-desktop.yml"
      - "packaging/**"
      - "desktop/continuity_bridge_lore.py"
      - "desktop/continuity_bridge_desktop/runtime.py"
      - "desktop/continuity_bridge_desktop/lore_runtime.py"
      - "desktop/continuity_bridge_desktop/onboarding.py"
      - "desktop/pyproject.toml"
      - "bin/**"
      - "src/**"
      - "browser-extension/**"
      - "package.json"
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUNDLED_LORE_VERSION: "0.2.0"
  BUNDLED_LORE_COMMIT: "7d10369ef265fb73e539223235979ef2f367bdb8"

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            archive: ContinuityBridge-windows-x64.zip
          - os: macos-latest
            label: macos
            archive: ContinuityBridge-macos.zip
          - os: ubuntu-latest
            label: linux-x64
            archive: ContinuityBridge-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out pinned Lore source
        uses: actions/checkout@v7
        with:
          repository: jordanhindo/lore
          ref: ${{ env.BUNDLED_LORE_COMMIT }}
          path: packaging/lore-source
          persist-credentials: false
      - name: Build pinned Lore runtime for this platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packaging/lore-runtime
          pushd packaging/lore-source >/dev/null
          test "$(node -p "require('./package.json').version")" = "$BUNDLED_LORE_VERSION"
          npm ci --no-audit --no-fund
          npm run build
          npm prune --omit=dev --no-audit --no-fund
          lore_package="$(npm pack --silent)"
          popd >/dev/null
          mkdir -p packaging/lore-runtime/node_modules/@jordanhindo/lore
          tar -xzf "packaging/lore-source/$lore_package" \
            --strip-components=1 \
            -C packaging/lore-runtime/node_modules/@jordanhindo/lore
          mv packaging/lore-source/node_modules \
            packaging/lore-runtime/node_modules/@jordanhindo/lore/node_modules
          node packaging/lore-runtime/node_modules/@jordanhindo/lore/dist/cli/lore.js help >/dev/null
          rm -rf packaging/lore-source
      - name: Install desktop build tooling
        run: python -m pip install ./desktop pyinstaller
      - name: Build Workstation application
        run: pyinstaller packaging/continuitybridge.spec --clean --noconfirm
      - name: Verify packaged Lore read/write path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "continuitybridge-lore-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          $env:LORE_DB = Join-Path $smoke "lore.db"
          & "dist/ContinuityBridge/ContinuityBridgeLore.exe" setup --home $smoke | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/ContinuityBridge/ContinuityBridgeLore.exe" status --json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $env:LORE_DB)) { throw "Packaged Lore did not create its SQLite store." }
      - name: Verify packaged Lore read/write path on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/continuitybridge-lore-smoke"
          mkdir -p "$smoke"
          export LORE_DB="$smoke/lore.db"
          dist/ContinuityBridge.app/Contents/MacOS/ContinuityBridgeLore setup --home "$smoke" >/dev/null
          dist/ContinuityBridge.app/Contents/MacOS/ContinuityBridgeLore status --json >/dev/null
          test -f "$LORE_DB"
      - name: Verify packaged Lore read/write path on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/continuitybridge-lore-smoke"
          mkdir -p "$smoke"
          export LORE_DB="$smoke/lore.db"
          dist/ContinuityBridge/ContinuityBridgeLore setup --home "$smoke" >/dev/null
          dist/ContinuityBridge/ContinuityBridgeLore status --json >/dev/null
          test -f "$LORE_DB"
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ContinuityBridge/* -DestinationPath "${{ matrix.archive }}"
      - name: Verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "continuitybridge-archive"
          Expand-Archive -Path "${{ matrix.archive }}" -DestinationPath $extract -Force
          if (-not (Test-Path (Join-Path $extract "ContinuityBridge.exe"))) { throw "ContinuityBridge.exe missing from archive." }
          if (-not (Test-Path (Join-Path $extract "ContinuityBridgeLore.exe"))) { throw "ContinuityBridgeLore.exe missing from archive." }
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ContinuityBridge.app "${{ matrix.archive }}"
      - name: Verify macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "${{ matrix.archive }}" >/dev/null
          listing="$(unzip -Z1 "${{ matrix.archive }}")"
          grep -Fxq "ContinuityBridge.app/Contents/MacOS/ContinuityBridge" <<<"$listing"
          grep -Fxq "ContinuityBridge.app/Contents/MacOS/ContinuityBridgeLore" <<<"$listing"
      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C dist ContinuityBridge
      - name: Verify Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          listing="$(tar -tzf "${{ matrix.archive }}")"
          grep -Fxq "ContinuityBridge/ContinuityBridge" <<<"$listing"
          grep -Fxq "ContinuityBridge/ContinuityBridgeLore" <<<"$listing"
      - name: Upload platform bundle
        uses: actions/upload-artifact@v7
        with:
          name: ContinuityBridge-${{ matrix.label }}
          path: ${{ matrix.archive }}
          archive: false
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built bundles
        uses: actions/download-artifact@v8
        with:
          pattern: ContinuityBridge-*
          path: release-assets
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ContinuityBridge-* > SHA256SUMS.txt
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ContinuityBridge $TAG" \
              --generate-notes
          fi
