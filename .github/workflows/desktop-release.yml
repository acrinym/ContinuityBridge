name: Desktop workstation packages

on:
  pull_request:
    paths:
      - "desktop/**"
      - "bin/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/desktop-release.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || matrix.platform == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive: ContinuityBridge-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            archive: ContinuityBridge-windows-x64.zip
          - os: macos-latest
            platform: macos
            archive: ContinuityBridge-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install desktop build tooling
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Locate bundled Node runtime on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CONTINUITYBRIDGE_NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"

      - name: Locate bundled Node runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          "CONTINUITYBRIDGE_NODE_BINARY=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build self-contained workstation
        run: pyinstaller --noconfirm --clean desktop/ContinuityBridge.spec

      - name: Package Linux workstation
        if: matrix.platform == 'linux'
        shell: bash
        run: tar -C dist -czf "${{ matrix.archive }}" ContinuityBridge

      - name: Package Windows workstation
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ContinuityBridge -DestinationPath "${{ matrix.archive }}"

      - name: Package macOS workstation
        if: matrix.platform == 'macos'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/ContinuityBridge.app "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: workstation-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: workstation-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$TAG" release-assets/* --title "ContinuityBridge $TAG" --generate-notes
