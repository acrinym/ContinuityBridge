[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-bridge-desktop"
version = "1.0.0"
description = "Finished local-first desktop workstation with bundled Lore, AI history import, explicit live capture, repository-aware recall, MCP connections, and portable continuation packages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Justin Gargano" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]

[project.scripts]
continuity-bridge-desktop = "continuity_bridge_desktop.onboarding:main"
continuity-bridge-gui = "continuity_bridge_desktop.onboarding:main"
continuity-bridge-import = "continuity_bridge_desktop.app:main"
continuity-bridge-connections = "continuity_bridge_desktop.control_center:main"
continuity-bridge-handoff = "continuity_bridge_desktop.handoff_builder:main"

[tool.setuptools]
packages = ["continuity_bridge_desktop"]
