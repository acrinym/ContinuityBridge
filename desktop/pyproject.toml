[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-bridge-desktop"
version = "0.2.0"
description = "Local desktop GUI for importing ChatGPT and Claude exports into Lore."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Justin Gargano" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]

[project.scripts]
continuity-bridge-gui = "continuity_bridge_desktop.app:main"

[tool.setuptools]
packages = ["continuity_bridge_desktop"]
