[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-bridge-desktop"
version = "0.3.0"
description = "Local desktop apps for importing AI history and connecting Lore MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Justin Gargano" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]

[project.scripts]
continuity-bridge-gui = "continuity_bridge_desktop.app:main"
continuity-bridge-connections = "continuity_bridge_desktop.control_center:main"

[tool.setuptools]
packages = ["continuity_bridge_desktop"]
