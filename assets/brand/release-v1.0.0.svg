<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ContinuityBridge 1.0.0 release</title>
  <desc id="desc">Release card describing the local-first ContinuityBridge workstation, platform archives, and core 1.0 capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.58" stop-color="#111a31"/>
      <stop offset="1" stop-color="#090d1b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill:#a9b6cb; }
      .white { fill:#f8fafc; }
      .card { fill:#11192a; stroke:#263550; stroke-width:2; }
      .small { font-size:22px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="120" r="250" fill="#6d28d9" opacity=".25" filter="url(#blur)"/>
  <circle cx="1220" cy="760" r="300" fill="#2563eb" opacity=".20" filter="url(#blur)"/>
  <circle cx="350" cy="820" r="280" fill="#0891b2" opacity=".10" filter="url(#blur)"/>

  <g transform="translate(76 64)">
    <rect width="78" height="78" rx="20" fill="#101a30" stroke="#324565" stroke-width="2"/>
    <path d="M16 49 Q27 25 39 39 M39 39 Q51 52 62 28 M16 29 Q27 52 39 39 M39 39 Q51 25 62 49" fill="none" stroke="url(#brand)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="39" cy="39" r="6" fill="#22d3ee"/>
  </g>
  <text x="174" y="113" class="sans white" font-size="40" font-weight="800">ContinuityBridge</text>
  <text x="76" y="206" class="sans white" font-size="78" font-weight="850">Version 1.0.0</text>
  <text x="76" y="260" class="sans" fill="url(#brand)" font-size="36" font-weight="750">Your AI tools should not forget each other.</text>
  <text x="76" y="320" class="sans muted" font-size="26">A local-first workstation for carrying source evidence, repository context,</text>
  <text x="76" y="357" class="sans muted" font-size="26">and explicit handoffs between AI sessions and tools.</text>

  <g transform="translate(76 410)">
    <rect class="card" width="450" height="186" rx="24"/>
    <text x="28" y="48" class="sans white" font-size="28" font-weight="750">Bring in evidence</text>
    <text x="28" y="88" class="sans muted small">• ChatGPT &amp; Claude exports</text>
    <text x="28" y="123" class="sans muted small">• Explicit browser live capture</text>
    <text x="28" y="158" class="sans muted small">• Local Lore initialization</text>
  </g>
  <g transform="translate(566 410)">
    <rect class="card" width="450" height="186" rx="24"/>
    <text x="28" y="48" class="sans white" font-size="28" font-weight="750">Recall with provenance</text>
    <text x="28" y="88" class="sans muted small">• Exact Lore message IDs</text>
    <text x="28" y="123" class="sans muted small">• Repository / issue / PR links</text>
    <text x="28" y="158" class="sans muted small">• Bounded source context</text>
  </g>
  <g transform="translate(1056 410)">
    <rect class="card" width="468" height="186" rx="24"/>
    <text x="28" y="48" class="sans white" font-size="28" font-weight="750">Continue anywhere</text>
    <text x="28" y="88" class="sans muted small">• Codex / Claude Code / Cursor MCP</text>
    <text x="28" y="123" class="sans muted small">• Portable Markdown / JSON handoffs</text>
    <text x="28" y="158" class="sans muted small">• Verified selected attachments</text>
  </g>

  <text x="76" y="666" class="sans white" font-size="30" font-weight="750">Portable release bundles</text>
  <g transform="translate(76 698)">
    <rect class="card" width="390" height="104" rx="20"/>
    <text x="24" y="40" class="sans white" font-size="24" font-weight="700">Windows x64</text>
    <text x="24" y="73" class="sans muted" font-size="19">ContinuityBridge-windows-x64.zip</text>
  </g>
  <g transform="translate(494 698)">
    <rect class="card" width="390" height="104" rx="20"/>
    <text x="24" y="40" class="sans white" font-size="24" font-weight="700">macOS</text>
    <text x="24" y="73" class="sans muted" font-size="19">ContinuityBridge-macos.zip (.app)</text>
  </g>
  <g transform="translate(912 698)">
    <rect class="card" width="390" height="104" rx="20"/>
    <text x="24" y="40" class="sans white" font-size="24" font-weight="700">Linux x64</text>
    <text x="24" y="73" class="sans muted" font-size="19">ContinuityBridge-linux-x64.tar.gz</text>
  </g>
  <g transform="translate(1330 698)">
    <rect class="card" width="194" height="104" rx="20"/>
    <text x="24" y="40" class="sans white" font-size="23" font-weight="700">Integrity</text>
    <text x="24" y="73" class="sans muted" font-size="19">SHA256SUMS.txt</text>
  </g>

  <text x="76" y="856" class="sans muted" font-size="19">Local-first • No model API key required for packaged use • Capture OFF by default • Unsigned 1.0 packages</text>
</svg>
